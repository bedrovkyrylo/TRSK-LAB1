services:
  app:
    build: .
    image: healthcheck-app
    container_name: healthcheck-app
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz/live')"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
